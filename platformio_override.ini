; Build profile for Nicolas Bernaerts Teleinfo on ESP32-S3 16 MB with BLE.
; Teleinfo source settings are copied from upstream user_config_override.h.

[platformio]
default_envs = tasmota32-teleinfo

[tasmota]
build_flags = -DUSE_BERRY_PARTITION_WIZARD

[env:tasmota32-teleinfo]
extends = env:tasmota32s3
board = esp32s3-16M
board_build.partitions = partitions/teleinfo_esp32s3_16M.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
build_flags = ${env:tasmota32_base.build_flags}
              -DFIRMWARE_TASMOTA32
              -DBUILD_ESP32S3_16M
              -DUSE_BLE_ESP32
              -DUSE_MI_ESP32
              -DCONFIG_NIMBLE_CPP_IDF=1
              -DOTA_URL='"https://github.com/Flobul/Tasmota-build-teleinfo-NicolasBernaerts/releases/latest/download/tasmota32-teleinfo.bin"'
lib_extra_dirs = lib/libesp32
                 lib/libesp32_div
                 lib/lib_basic
                 lib/lib_i2c
                 lib/lib_display
                 lib/lib_ssl
                 lib/lib_rf
                 lib/lib_div
lib_deps = bblanchon/ArduinoJson
