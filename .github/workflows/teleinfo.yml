name: Teleinfo Extension Compilation

on:
  workflow_dispatch:
    inputs:
      tasmotaVer:
        description: Tasmota version compatible with Teleinfo
        required: false
        default: 15.2.0
        type: choice
        options:
          - 15.2.0
          - 15.1.0
      addFiles:
        description: Run the additional command below
        required: false
        default: false
        type: boolean
      files:
        description: Additional command to run before compilation
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

env:
  TASMOTA_VERSION: ${{ inputs.tasmotaVer || '15.2.0' }}

jobs:
  build:
    name: Build Teleinfo firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Cache PlatformIO dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ env.TASMOTA_VERSION }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download latest Nicolas Bernaerts Teleinfo sources
        run: git clone --depth 1 --branch master https://github.com/NicolasBernaerts/tasmota.git NicolasBernaerts-tasmota

      - name: Read Teleinfo source version
        shell: bash
        run: |
          set -euo pipefail
          config=NicolasBernaerts-tasmota/teleinfo/user_config_override.h
          extension_version=$(sed -n 's/^#define EXTENSION_VERSION[[:space:]]*"\([^"]*\)".*/\1/p' "$config")
          test -n "$extension_version"
          echo "EXT_VERSION=$extension_version" >> "$GITHUB_ENV"
          echo "EXT_COMMIT=$(git -C NicolasBernaerts-tasmota rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Download Tasmota
        run: git clone --depth 1 --branch "v${TASMOTA_VERSION}" https://github.com/arendst/Tasmota.git "Tasmota-${TASMOTA_VERSION}"

      - name: Install Teleinfo sources in Tasmota
        shell: bash
        run: |
          set -euo pipefail
          source_dir=NicolasBernaerts-tasmota
          target_dir="Tasmota-${TASMOTA_VERSION}"

          cp platformio_override.ini "$target_dir/platformio_override.ini"
          cp teleinfo_esp32s3_16M.csv "$target_dir/partitions/"
          cp "$source_dir/teleinfo/user_config_override.h" "$target_dir/tasmota/user_config_override.h"
          cat user_config_additions.h >> "$target_dir/tasmota/user_config_override.h"
          cp "$source_dir/teleinfo/tasmota.h" "$target_dir/tasmota/include/tasmota.h"
          cp "$source_dir/teleinfo/tasmota_types.h" "$target_dir/tasmota/include/tasmota_types.h"
          cp "$source_dir/teleinfo/xdrv_01_9_webserver.ino" "$target_dir/tasmota/tasmota_xdrv_driver/"
          cp xdrv_01_99_teleinfo_compat.ino "$target_dir/tasmota/tasmota_xdrv_driver/"
          cp "$source_dir/teleinfo/xnrg_15_teleinfo.ino" "$target_dir/tasmota/tasmota_xnrg_energy/"

          # Keep Nicolas Bernaerts' compilation order: core modules first,
          # integration modules after xdrv_99_misc_option. The numbered _20
          # dispatcher is obsolete; xdrv_98_teleinfo.ino is the current one.
          for module in 00 02 03 04 05 15; do
            cp "$source_dir"/teleinfo/xdrv_98_${module}_*.ino "$target_dir/tasmota/tasmota_xdrv_driver/"
          done
          for module in 06 07 08 09 10 11 12 13 14; do
            cp "$source_dir"/teleinfo/xdrv_98_${module}_*.ino "$target_dir/tasmota/tasmota_xsns_sensor/"
          done
          cp "$source_dir/teleinfo/xdrv_98_teleinfo.ino" "$target_dir/tasmota/tasmota_xsns_sensor/"

          cp "$source_dir"/common/partition/*.csv "$target_dir/partitions/"
          cp "$source_dir"/common/board/*.json "$target_dir/boards/"
          cp "$source_dir/common/support_calendar.ino" "$target_dir/tasmota/tasmota_support/"
          cp "$source_dir/common/xdrv_94_ip_option.ino" "$target_dir/tasmota/tasmota_xdrv_driver/"
          cp "$source_dir/common/xdrv_97_tcp_server.ino" "$target_dir/tasmota/tasmota_xdrv_driver/"
          cp "$source_dir/common/xdrv_97_rte_client.ino" "$target_dir/tasmota/tasmota_xdrv_driver/"
          cp "$source_dir/common/xdrv_99_misc_option.ino" "$target_dir/tasmota/tasmota_xdrv_driver/"
          cp "$source_dir/common/xsns_99_timezone.ino" "$target_dir/tasmota/tasmota_xsns_sensor/"

      - name: Run additional command
        if: ${{ inputs.addFiles }}
        run: ${{ inputs.files }}

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio PyYAML

      - name: Compile
        working-directory: Tasmota-${{ env.TASMOTA_VERSION }}
        run: pio run -e tasmota32-teleinfo

      - name: List generated firmware
        run: find "Tasmota-${TASMOTA_VERSION}/build_output/firmware" -maxdepth 1 -type f -printf '%f %k KB\n'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Tasmota-${{ env.TASMOTA_VERSION }}/build_output/firmware/*
          tag_name: Tasmota-v${{ env.TASMOTA_VERSION }}-TeleinfoExt-${{ env.EXT_VERSION }}
          name: Tasmota ${{ env.TASMOTA_VERSION }} - Teleinfo ${{ env.EXT_VERSION }}
          body: |
            Tasmota ${{ env.TASMOTA_VERSION }} with Nicolas Bernaerts Teleinfo ${{ env.EXT_VERSION }}.
            Teleinfo upstream commit: `${{ env.EXT_COMMIT }}`.
          generate_release_notes: true
